name: Static editor checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check home.js
          node --check editor-utils.js
      - name: Run utility tests
        run: node --test tests/editor-utils.test.cjs
